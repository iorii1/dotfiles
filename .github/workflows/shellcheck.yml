name: shellcheck

on:
  push:
    paths:
      - "**.sh"
      - "scripts/.local/bin/take-screenshot"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**.sh"
      - "scripts/.local/bin/take-screenshot"
      - ".github/workflows/shellcheck.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck install.sh wallpaper-picker/dotfiless_matugen.sh scripts/.local/bin/take-screenshot
