bind=ALT,Q,killclient
bind=ALT,RETURN,spawn,kitty
bind=SUPER,M,quit
bind=SUPER,R,reload_config
bind=SUPER+SHIFT,e,quit

bind=ALT,SPACE,spawn,rofi -show drun -location 1 -xoffset 14 -yoffset 38


bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,space,togglefloating

# Cycle through all layouts listed in circle_layout (config.conf)
bind=SUPER,n,switch_layout

# Jump straight to a specific layout
bind=SUPER+ALT,t,setlayout,tile
bind=SUPER+ALT,s,setlayout,scroller
bind=SUPER+ALT,m,setlayout,monocle
bind=SUPER+ALT,g,setlayout,grid
bind=SUPER+ALT,d,setlayout,dwindle
bind=SUPER+ALT,c,setlayout,center_tile
bind=SUPER+ALT,f,setlayout,fair

# Niri-style scroller controls
bind=SUPER,o,toggleoverview
bind=SUPER,w,switch_proportion_preset
bind=SUPER,equal,switch_proportion_preset,next
bind=SUPER,minus,switch_proportion_preset,prev
bind=SUPER,comma,scroller_stack,up
bind=SUPER,period,scroller_stack,down

bind=SUPER,Page_Down,viewtoright_have_client
bind=SUPER,Page_Up,viewtoleft_have_client
bind=SUPER+SHIFT,Page_Down,tagtoright
bind=SUPER+SHIFT,Page_Up,tagtoleft

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_right,killclient



gesturebind=none,left,2,focusdir,left
gesturebind=none,right,2,focusdir,right
gesturebind=none,up,2,focusdir,up
gesturebind=none,down,2,focusdir,down

gesturebind=none,left,3,viewtoleft_have_client
gesturebind=none,right,3,viewtoright_have_client
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9


bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle


bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +2%
bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 2%-
bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 1%

bind=NONE,Print,spawn,~/.local/bin/take-screenshot full

bind=SHIFT,Print,spawn,~/.local/bin/take-screenshot region-clip

bind=SUPER+SHIFT,s,spawn,~/.local/bin/take-screenshot region-save
