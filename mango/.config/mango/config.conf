source=~/.config/mango/theme.conf
source=~/.config/mango/keybinds.conf
source=~/.config/mango/monitor.conf
source=~/.config/mango/autostart.conf

blur=1

blur_layer=1

blur_params_radius=8


# Window & layer animations
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
animation_duration_open=260
animation_duration_close=200
animation_duration_move=260
animation_duration_tag=230
animation_duration_focus=140
animation_curve_open=0.16,1,0.3,1
animation_curve_close=0.4,0,1,1
animation_curve_move=0.16,1,0.3,1
animation_curve_tag=0.16,1,0.3,1
animation_curve_focus=0.16,1,0.3,1
animation_curve_opafadein=0.16,1,0.3,1
animation_curve_opafadeout=0.4,0,1,1

# Rofi now opens top-center under the bar (see StartMenuWidget.qml) so it can
# slide straight down from the bar edge instead of zooming diagonally from
# whatever corner it used to sit in.
layerrule=layer_name:^rofi$,animation_type_open:slide,animation_type_close:slide

# mako notifications: slide down from the top edge instead of the plain
# fade you get with no explicit layer_animation_type
layerrule=layer_name:^notifications$,animation_type_open:slide,animation_type_close:slide

# Layouts to cycle through with switch_layout (bound to SUPER,n)
circle_layout=tile,scroller,grid,monocle,deck,center_tile,right_tile,vertical_scroller,vertical_tile,vertical_grid,vertical_deck,dwindle,fair,vertical_fair

# Default to scroller (niri/PaperWM-style scrolling columns) on every tag
tagrule=id:*,layout_name:scroller

# Pull the focused column into view when it was scrolled out of view (niri-like)
# scroller_prefer_overspread has higher priority than scroller_prefer_center, so it must be off
# for scroller_prefer_center to take effect
scroller_prefer_overspread=0
scroller_prefer_center=1

# Niri-style hot corner: cursor to top-left toggles overview
enable_hotarea=1
hotarea_corner=0
hotarea_size=10

