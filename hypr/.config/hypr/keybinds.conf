bind = ALT, Q, killactive
bind = ALT, RETURN, exec, kitty
bind = SUPER, M, exit
bind = SUPER, R, exec, hyprctl reload
bind = SUPER SHIFT, E, exit

bind = ALT, SPACE, exec, rofi -show drun -location 2 -xoffset 0 -yoffset 38

bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, space, togglefloating

# Next/prev workspace (mango's "skip empty tags" has no direct Hyprland
# equivalent, so this is a plain relative move instead)
bind = SUPER, Page_Down, workspace, +1
bind = SUPER, Page_Up, workspace, -1
bind = SUPER SHIFT, Page_Down, movetoworkspace, +1
bind = SUPER SHIFT, Page_Up, movetoworkspace, -1

bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d

bind = SUPER, h, movefocus, l
bind = SUPER, j, movefocus, d
bind = SUPER, k, movefocus, u
bind = SUPER, l, movefocus, r

bind = SUPER SHIFT, Left, swapwindow, l
bind = SUPER SHIFT, Right, swapwindow, r
bind = SUPER SHIFT, Up, swapwindow, u
bind = SUPER SHIFT, Down, swapwindow, d

bind = SUPER SHIFT, h, swapwindow, l
bind = SUPER SHIFT, j, swapwindow, d
bind = SUPER SHIFT, k, swapwindow, u
bind = SUPER SHIFT, l, swapwindow, r

# Resize the focused window (h/l = width, j/k = height) — animates here,
# unlike mango, since resizeactive isn't hardcoded to skip tiled clients
bind = SUPER CTRL, h, resizeactive, -50 0
bind = SUPER CTRL, l, resizeactive, 50 0
bind = SUPER CTRL, j, resizeactive, 0 50
bind = SUPER CTRL, k, resizeactive, 0 -50

bind = SUPER CTRL, Left, resizeactive, -50 0
bind = SUPER CTRL, Right, resizeactive, 50 0
bind = SUPER CTRL, Down, resizeactive, 0 50
bind = SUPER CTRL, Up, resizeactive, 0 -50

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER CTRL, mouse:273, killactive

# Touchpad gestures — syntax not yet verified live, check once Hyprland
# is actually running and adjust (see PR notes)
bindg = , swipe:3:l, workspace, -1
bindg = , swipe:3:r, workspace, +1

bindg = , swipe:2:l, movefocus, l
bindg = , swipe:2:r, movefocus, r
bindg = , swipe:2:u, movefocus, u
bindg = , swipe:2:d, movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
bindl = SHIFT, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause

bindl = , XF86MonBrightnessUp, exec, brightnessctl s +2%
bindl = SHIFT, XF86MonBrightnessUp, exec, brightnessctl s 100%
bindl = , XF86MonBrightnessDown, exec, brightnessctl s 2%-
bindl = SHIFT, XF86MonBrightnessDown, exec, brightnessctl s 1%

bind = , Print, exec, ~/.local/bin/take-screenshot full
bind = SHIFT, Print, exec, ~/.local/bin/take-screenshot region-clip
bind = SUPER SHIFT, s, exec, ~/.local/bin/take-screenshot region-save
