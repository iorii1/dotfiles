source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf

# Makes Qt apps render with the GTK3 theme (and thus matugen's colors, via
# the generated ~/.config/gtk-3.0/gtk.css) instead of plain Qt defaults.
env = QT_QPA_PLATFORMTHEME,gtk3

general {
    layout = dwindle

    gaps_in = 6
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(38bdf8ff)
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 8
        passes = 2
    }
}

dwindle {
    preserve_split = true
}

bezier = mangoOpen, 0.16, 1, 0.3, 1
bezier = mangoClose, 0.4, 0, 1, 1
bezier = mangoFocus, 0.16, 1, 0.3, 1
bezier = mangoFadeOut, 0.4, 0, 1, 1

animations {
    enabled = true

    animation = windows, 1, 2.6, mangoOpen, popin 80%
    animation = windowsOut, 1, 2.0, mangoClose, popin 80%
    animation = border, 1, 1.4, mangoFocus
    animation = fade, 1, 2.6, mangoOpen
    animation = fadeOut, 1, 2.0, mangoFadeOut
    animation = workspaces, 1, 2.3, mangoOpen, slide
    animation = layers, 1, 2.6, mangoOpen, popin 80%
}

# Rofi and mako slide down from the bar edge instead of the default fade
layerrule = animation slide, match:namespace ^rofi$
layerrule = animation slide, match:namespace ^notifications$
layerrule = blur on, match:namespace ^rofi$
layerrule = blur on, match:namespace ^notifications$

# Quickshell bar + notification toasts: slide in from their anchored edge
# instead of the default "popin" (which pops in from the center of the
# screen and looks wrong for edge-anchored panels)
layerrule = animation slide, match:namespace ^quickshell$

# Quickshell popup cards (launcher, quick settings, calendar, media, etc.):
# these already animate themselves (fade/scale) in QML, and a directional
# slide clips round content (e.g. the media widget's disc) awkwardly
# against the screen edge mid-transition, so just fade the surface in.
layerrule = animation fade, match:namespace ^quickshell-popup$
